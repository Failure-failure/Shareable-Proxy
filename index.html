<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

<h2>Enter Password</h2>
<input type="password" id="password">
<button onclick="login()">Login</button>

<p id="message" style="color:red;"></p>
<div id="embeddedSite"></div>

<script>
async function login() {
  const password = document.getElementById("password").value;

  const response = await fetch("https://script.google.com/macros/s/AKfycbzsrg1Dw56HdGvaoFg19YVCFoF7jAD56kwDehn8E6cV1qHqVB7iUE0ihRlH8EtCOsxDvA/exec", {
    method: "POST",
    body: JSON.stringify({ password })
  });

  const result = await response.json();

  if (result.success) {
    document.getElementById("message").innerText = "";
    
    const iframe = document.createElement("iframe");
    iframe.src = result.link; 
    iframe.width = "100%";
    iframe.height = "800";
    iframe.style.border = "none";

    const container = document.getElementById("embeddedSite");
    container.innerHTML = "";
    container.appendChild(iframe);
  } else {
    document.getElementById("message").innerText = "Wrong password";
    document.getElementById("embeddedSite").innerHTML = "";
  }
}
</script>

</body>
</html>
