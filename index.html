<!DOCTYPE html>
<html>
<head>
  <title>School Work</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    #loginContainer {
      margin-top: 20vh;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: none;
    }
  </style>
</head>

<body>

<div id="loginContainer">
  <h2>Enter Password</h2>
  <input type="password" id="password">
  <button onclick="login()">Login</button>
  <p id="message" style="color:red;"></p>
</div>

<iframe id="embeddedSite"></iframe>

<script>
async function login() {
  const password = document.getElementById("password").value;

  const response = await fetch("https://script.google.com/macros/s/AKfycbzsrg1Dw56HdGvaoFg19YVCFoF7jAD56kwDehn8E6cV1qHqVB7iUE0ihRlH8EtCOsxDvA/exec", {
    method: "POST",
    body: JSON.stringify({ password })
  });

  const result = await response.json();

  if (result.success) {

    document.getElementById("loginContainer").style.display = "none";

    const iframe = document.getElementById("embeddedSite");
    iframe.src = result.link;
    iframe.style.display = "block";

    document.body.style.overflow = "hidden";

  } else {
    document.getElementById("message").innerText = "Wrong password";
  }
}
</script>

</body>
</html>
